<body class="min-h-screen transition-colors duration-300 bg-white text-black">

<button id="themeBtn"
  class="fixed top-5 right-5 px-4 py-2 rounded-lg bg-gray-200">
  Change Theme
</button>

<script>
const themes = [
  { bg: "bg-white", text: "text-black" },
  { bg: "bg-black", text: "text-white" },
  { bg: "bg-lime-500", text: "text-black" }
];

let current = 0;
const body = document.body;
const btn = document.getElementById("themeBtn");

btn.addEventListener("click", () => {
  // Remove all theme classes
  themes.forEach(t => {
    body.classList.remove(t.bg, t.text);
  });

  // Move to next theme
  current = (current + 1) % themes.length;

  // Apply new theme
  body.classList.add(themes[current].bg, themes[current].text);
});
</script>
